appId: dev.nextide.app
productName: next-ide
afterPack: build/afterPack.cjs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# node-pty ships a native binary and a spawn helper that must stay on disk, outside the asar.
asarUnpack:
  - '**/node_modules/node-pty/**'
  # koffi (window blur) loads a native binary too.
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
# Swift dictation helper (built by scripts/build-dictation.mjs), shipped next to app.asar.
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # One DMG per architecture: Apple Silicon (arm64) and Intel (x64).
  target:
    - target: dir
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  # Developer ID signing + hardened runtime. With no Developer ID certificate available
  # (CSC_IDENTITY_AUTO_DISCOVERY=false or none in the keychain) the app stays ad-hoc signed
  # by build/afterPack.cjs. Notarization is turned on per build: -c.mac.notarize=true plus the
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER env vars (see .github/workflows/release.yml).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    LSUIElement: false
    NSMicrophoneUsageDescription: O next-ide usa o microfone para o ditado por voz no composer.
    NSSpeechRecognitionUsageDescription: O next-ide transcreve sua fala no próprio Mac para o ditado por voz.
dmg:
  title: next-ide
  artifactName: next-ide-${version}-${arch}.dmg
