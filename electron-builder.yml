appId: dev.nextide.app
productName: next-ide
afterPack: build/afterPack.cjs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# node-pty ships a native binary and a spawn helper that must stay on disk, outside the asar.
asarUnpack:
  - '**/node_modules/node-pty/**'
  # koffi (window blur) loads a native binary too.
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
# Swift dictation helper (built by scripts/build-dictation.mjs), shipped next to app.asar.
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dir
    - dmg
  identity: null
  extendInfo:
    LSUIElement: false
    NSMicrophoneUsageDescription: O next-ide usa o microfone para o ditado por voz no composer.
    NSSpeechRecognitionUsageDescription: O next-ide transcreve sua fala no próprio Mac para o ditado por voz.
dmg:
  title: next-ide
  artifactName: next-ide-${version}-${arch}.dmg
