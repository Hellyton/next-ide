name: Release

# Builds the macOS DMG and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0 (git tag v0.1.0 && git push origin v0.1.0),
# or run it by hand from the Actions tab (builds the DMG as a workflow artifact only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon runner. The dictation helper uses SpeechAnalyzer, which needs the macOS 26 SDK
    # (Xcode 26+); build-dictation.mjs skips the helper only when swiftc is missing, so keep this
    # on an image that ships Xcode 26 or newer.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build DMG
        # --publish never: the release step below uploads the DMG; electron-builder must not.
        run: npm run dist -- --publish never
        env:
          # No Developer ID certificate: the app is signed ad hoc (build/afterPack.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: next-ide-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "next-ide $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
