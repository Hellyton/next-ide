name: Release

# Builds the macOS DMG, signs and notarizes it, and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0 (git tag v0.1.0 && git push origin v0.1.0),
# or run it by hand from the Actions tab (builds the DMG as a workflow artifact only).
#
# Signing secrets live in the "release" environment (Settings > Environments), not in
# repository secrets, so only this job can read them, and only after the environment's
# protection rules pass. Without them the build still works, ad-hoc signed and not notarized.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon runner. macos-15 has far more capacity than macos-26 (jobs there were dropped
    # with "not acquired by Runner"), and it ships Xcode 26, which the dictation helper needs
    # (SpeechAnalyzer, macOS 26 SDK). The step below switches to the newest Xcode 26 on the image.
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcrun --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare signing credentials
        id: creds
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "api_key=$key" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing: building an ad-hoc signed, non-notarized DMG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # Throwaway keychain that only lives for this job (deleted in the cleanup step).
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 32)"
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Apple's public Developer ID intermediates (G1 and G2): without them a clean runner can't
          # build the certificate chain and reports the identity as invalid.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'; then
            echo "Identities in the job keychain (valid or not):"
            security find-identity -p codesigning "$keychain"
            echo "Private keys in the job keychain: $(security dump-keychain "$keychain" | grep -c 'class: 0x00000010')"
            echo "::error::No valid Developer ID Application identity. If 'Private keys' is 0, re-export the .p12 from Keychain Access > My Certificates, including the private key."
            exit 1
          fi

      - name: Build, sign and notarize
        if: steps.creds.outputs.signed == 'true'
        env:
          # Signs with the identity imported above; electron-builder must not build its own keychain.
          CSC_NAME: 'Thiago Lopes (258J57444Q)'
          APPLE_API_KEY: ${{ steps.creds.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # --publish never: the release step below uploads the DMG; electron-builder must not.
        run: npm run dist -- --publish never -c.mac.notarize=true -c.dmg.sign=true

      - name: Notarize and staple the DMG
        if: steps.creds.outputs.signed == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --wait \
              --key "${{ steps.creds.outputs.api_key }}" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Build (unsigned)
        if: steps.creds.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: next-ide-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "next-ide $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
